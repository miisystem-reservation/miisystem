<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>三井 予約サイト（三井地域センター）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    header {
      background-color: #4285F4;
      color: white;
      padding: 20px;
      text-align: left;
    }
    header h1 {
      margin: 0;
      font-size: 24px;
    }

    .description {
      margin: 20px;
    }

    iframe {
      display: block;
      margin: 20px auto;
      width: 100%;
      max-width: 800px;
      height: 600px;
      border: none;
    }

    .form-button {
      display: inline-block;
      margin: 20px auto;
      text-decoration: none;
      border-radius: 8px;
    }
    .form-button img {
      width: 100%;
      max-width: 300px;
      height: auto;
      border-radius: 8px;
      transition: opacity 0.3s;
    }
    .form-button img:hover {
      opacity: 0.8;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 20px;
      }
      .form-button img {
        max-width: 80%;
      }
      iframe {
        height: 400px;
      }
    }
  </style>
</head>
<body>
  <header>
    <img src="logo.png" alt="My Portfolio">
  </header>

  <div class="description">
    <img src="description2.png" alt="三井地域センター" style="max-width:100%; height:auto;">
  </div>

  <section>
    <iframe src="https://calendar.google.com/calendar/embed?src=0a4ae93f6a280a8234156016ff7826f6eb0277345aee7a85bb5b345113317c83%40group.calendar.google.com&ctz=Asia%2FTokyo"></iframe>
  </section>

  <section>
    <a href="https://docs.google.com/forms/d/e/1FAIpQLSceVuPd7I5IKlGMgrE9pE_uw0exUXej9UZCE7wcUVszGrm_Sw/viewform?usp=dialog" class="form-button">
      <img src="reserve-button.png" alt="予約をする">
    </a>
  </section>

  <section>
    <a href="index.html" class="form-button">
      <img src="return.png" alt="戻る">
    </a>
  </section>
</body>
</html>
