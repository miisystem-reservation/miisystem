<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>予約一覧</title>
  <style>
    table {
      border-collapse: collapse;
      width: 100%;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 6px 10px;
      text-align: left;
    }
    th {
      background: #f0f0f0;
    }
  </style>
</head>
<body>
  <h1>予約一覧</h1>
  <table id="reservationTable">
    <thead>
      <tr>
        <th>団体名</th>
        <th>施設</th>
        <th>部屋</th>
        <th>日付</th>
        <th>時間</th>
        <th>地区</th>
        <th>人数</th>
        <th>料金区分</th>
        <th>料金</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    async function loadReservations() {
      const response = await fetch("GASのWebアプリURL"); // 公開したdoGetのURL
      const data = await response.json();

      const tbody = document.querySelector("#reservationTable tbody");
      tbody.innerHTML = "";

      data.forEach(item => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${item["団体名"]}</td>
          <td>${item["施設"]}</td>
          <td>${item["部屋"]}</td>
          <td>${item["日付"]}</td>
          <td>${item["開始"]} ～ ${item["終了"]}</td>
          <td>${item["地区"] || ""}</td>
          <td>${item["人数合計"] ? `合計 ${item["人数合計"]} 名（会員 ${item["会員人数"]} 名）` : ""}</td>
          <td>${item["料金区分"]}</td>
          <td>${item["料金"]} 円</td>
        `;
        tbody.appendChild(tr);
      });
    }

    loadReservations();
  </script>
</body>
</html>
