<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>三井 予約サイト（幹事用）（確認用）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    header {
      background-color: #4285F4;
      color: white;
      padding: 20px;
      text-align: left;
    }
    header h1 {
      margin: 0;
      font-size: 24px;
    }

    .description {
      margin: 20px;
    }

    iframe {
      display: block;
      margin: 20px auto;
      width: 100%;
      max-width: 800px;
      height: 600px;
      border: none;
    }

    .form-button {
      display: inline-block;
      margin: 20px auto;
      text-decoration: none;
      border-radius: 8px;
    }
    .form-button img {
      width: 100%;
      max-width: 300px;
      height: auto;
      border-radius: 8px;
      transition: opacity 0.3s;
    }
    .form-button img:hover {
      opacity: 0.8;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 20px;
      }
      .form-button img {
        max-width: 80%;
      }
      iframe {
        height: 400px;
      }
    }
  </style>
</head>
<body>
  <header>
    <img src="logo.png" alt="My Portfolio">
  </header>

  <iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vRjI_v66hDXbB14uotsfzk9gokT1kaylPPbT3bqtbvmuHpKNJNly8WEFpU6tlTb_xeeFcUQWcGAh4bh/pubhtml?gid=0&amp;single=true&amp;widget=true&amp;headers=false"></iframe>
</body>
</html>
